# Development stack: PostgreSQL, NATS JetStream, Kratos and the birge api and
# worker. Development only: trust authentication, generated keys, push and SMS
# logged instead of sent. Only the API is published, on 127.0.0.1:8080.
# Start with ./up.sh.
name: birge-dev

x-birge-env: &birge-env
  DATABASE_URL: postgres://birge_app@postgres:5432/birge?sslmode=disable
  NATS_URL: nats://nats:4222
  KRATOS_PUBLIC_URL: http://kratos:4433
  KRATOS_ADMIN_URL: http://kratos:4434
  BIRGE_KEK_ID: local-1
  BIRGE_KEK_KEYSET_FILE: /secrets/kek.json
  BIRGE_BLIND_INDEX_KEY_FILE: /secrets/blind-index.key
  BIRGE_POW_KEY_FILE: /secrets/pow.key
  BIRGE_HASH_KEY_FILE: /secrets/hash.key
  BIRGE_SMS_ALLOWED_PREFIXES: ${BIRGE_SMS_ALLOWED_PREFIXES:-+77}
  BIRGE_PRACTICES_BASE_URL: https://objects.example.invalid
  BIRGE_DELIVERY_MODE: dev
  # Development retries the sign-in many times from one number and one
  # phone; the production defaults (3 codes per number per 10 minutes,
  # 5 SMS per number per hour) would lock testers out. Override to test them.
  BIRGE_AUTH_RATE_PER_NUMBER: ${BIRGE_AUTH_RATE_PER_NUMBER:-60/1s}
  BIRGE_AUTH_RATE_PER_IP: ${BIRGE_AUTH_RATE_PER_IP:-120/1s}
  BIRGE_SMS_PER_NUMBER_LIMIT: ${BIRGE_SMS_PER_NUMBER_LIMIT:-500}
  # The web client below; native clients send no Origin and stay allowed.
  BIRGE_CHAT_WS_ORIGINS: localhost:8081

services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  nats:
    image: nats:2.11.9-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - natsdata:/data

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    command: ["migrate", "sql", "-e", "--yes"]
    environment:
      DSN: postgres://kratos@postgres:5432/kratos?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  kratos:
    image: oryd/kratos:v26.2.0
    # Secrets come from the volume keygen fills, never from the tree.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        export SECRETS_DEFAULT=$$(cat /secrets/kratos-secret) SECRETS_COOKIE=$$(cat /secrets/kratos-secret)
        SECRETS_CIPHER=$$(cat /secrets/kratos-cipher) &&
        exec kratos serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    environment:
      DSN: postgres://kratos@postgres:5432/kratos?sslmode=disable
    volumes:
      - ./kratos:/etc/config/kratos:ro
      - secrets:/secrets:ro
    depends_on:
      kratos-migrate: { condition: service_completed_successfully }
      keygen: { condition: service_completed_successfully }

  # Writes the development keys and the Kratos secrets once into the secrets
  # volume; later starts keep them (and the data stays readable). Runs as
  # root only to hand the new volume to the image's birge user.
  keygen:
    build: { context: ../.., dockerfile: deploy/compose/Dockerfile }
    image: birge-dev:local
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        umask 077 &&
        { test -f /secrets/kek.json || birge keygen -dir /secrets; } &&
        { test -f /secrets/kratos-secret || od -An -tx1 -N32 /dev/urandom | tr -d ' \n' >/secrets/kratos-secret; } &&
        { test -f /secrets/kratos-cipher || od -An -tx1 -N16 /dev/urandom | tr -d ' \n' >/secrets/kratos-cipher; } &&
        chown -R birge /secrets && chmod 0644 /secrets/kratos-secret /secrets/kratos-cipher
    volumes:
      - secrets:/secrets

  migrate:
    image: birge-dev:local
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://birge_migrator@postgres:5432/birge?sslmode=disable
      BIRGE_APPLY_ROLES: "1"
    depends_on:
      postgres: { condition: service_healthy }
      keygen: { condition: service_completed_successfully }

  api:
    image: birge-dev:local
    command: ["api"]
    environment: *birge-env
    volumes:
      - secrets:/secrets:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
      kratos: { condition: service_started }
      nats: { condition: service_started }

  worker:
    image: birge-dev:local
    command: ["worker"]
    environment: *birge-env
    volumes:
      - secrets:/secrets:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_started }

  # The exported web app (./up.sh web builds it) on 127.0.0.1:8081. Browsers
  # need a secure context for the sign-in proof-of-work (WebCrypto), and
  # localhost is one: from another machine use `ssh -L 8081:localhost:8081`.
  # Recreated after every export: the export replaces the dist directory.
  web:
    image: caddy:2.10.2-alpine
    profiles: [web]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../apps/mobile/dist:/srv:ro
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  natsdata:
  secrets:
