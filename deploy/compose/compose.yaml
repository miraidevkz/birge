# Development stack: PostgreSQL, NATS JetStream, Kratos and the birge api and
# worker. Development only: trust authentication, generated keys, push and SMS
# logged instead of sent. Only the API is published, on 127.0.0.1:8080.
# Start with ./up.sh.
name: birge-dev

x-birge-env: &birge-env
  DATABASE_URL: postgres://birge_app@postgres:5432/birge?sslmode=disable
  NATS_URL: nats://nats:4222
  KRATOS_PUBLIC_URL: http://kratos:4433
  KRATOS_ADMIN_URL: http://kratos:4434
  BIRGE_KEK_ID: local-1
  BIRGE_KEK_KEYSET_FILE: /secrets/kek.json
  BIRGE_BLIND_INDEX_KEY_FILE: /secrets/blind-index.key
  BIRGE_POW_KEY_FILE: /secrets/pow.key
  BIRGE_HASH_KEY_FILE: /secrets/hash.key
  BIRGE_PLAN_LINK_KEY_FILE: /secrets/plan-link.key
  BIRGE_ANALYTICS_KEY_FILE: /secrets/analytics.key
  # Origin of the member web app; SMS links are <this>/plan#<token> and <this>/sos-link#<token>.
  # Same variable and default as ./up.sh web.
  BIRGE_PUBLIC_URL: ${BIRGE_PUBLIC_URL:-http://localhost:8081}
  BIRGE_SMS_ALLOWED_PREFIXES: ${BIRGE_SMS_ALLOWED_PREFIXES:-+77}
  BIRGE_PRACTICES_BASE_URL: https://objects.example.invalid
  BIRGE_DELIVERY_MODE: dev
  # Development retries the sign-in many times from one number and one
  # phone; the production defaults (3 codes per number per 10 minutes,
  # 5 SMS per number per hour) would lock testers out. Override to test them.
  BIRGE_AUTH_RATE_PER_NUMBER: ${BIRGE_AUTH_RATE_PER_NUMBER:-60/1s}
  BIRGE_AUTH_RATE_PER_IP: ${BIRGE_AUTH_RATE_PER_IP:-120/1s}
  BIRGE_SMS_PER_NUMBER_LIMIT: ${BIRGE_SMS_PER_NUMBER_LIMIT:-500}
  # The web client below (and its public host, if the stack is published
  # through a tunnel); native clients send no Origin and stay allowed.
  BIRGE_CHAT_WS_ORIGINS: ${BIRGE_CHAT_WS_ORIGINS:-localhost:8081}
  # Staff sign-in through the development Hydra below. amr "dev" stands in
  # for the second factor: only this stack accepts it (cmd/birge-devlogin).
  BIRGE_STAFF_INTROSPECTION_URL: http://hydra:4445/admin/oauth2/introspect
  BIRGE_STAFF_CLIENT_ID: birge-api
  BIRGE_STAFF_CLIENT_SECRET_FILE: /secrets/hydra-introspect
  BIRGE_STAFF_ISSUER: http://localhost:4444/
  BIRGE_STAFF_AUDIENCE: birge-admin
  BIRGE_STAFF_ROLES_CLAIM: ext.roles
  BIRGE_STAFF_ROLE_MAP: psychologist=psychologist,moderator=moderator,lawyer=lawyer,admin=admin
  BIRGE_STAFF_MFA_AMR: dev

services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  nats:
    image: nats:2.11.9-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - natsdata:/data

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    command: ["migrate", "sql", "-e", "--yes"]
    environment:
      DSN: postgres://kratos@postgres:5432/kratos?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  kratos:
    image: oryd/kratos:v26.2.0
    # Secrets come from the volume keygen fills, never from the tree.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        export SECRETS_DEFAULT=$$(cat /secrets/kratos-secret) SECRETS_COOKIE=$$(cat /secrets/kratos-secret)
        SECRETS_CIPHER=$$(cat /secrets/kratos-cipher) &&
        set -- -c /etc/config/kratos/kratos.yml &&
        if [ "$$BIRGE_KRATOS_COURIER" = hook ]; then
        sed "s/Bearer @COURIER_SECRET@/Bearer $$(cat /secrets/courier-hook.secret)/" /etc/config/kratos/courier-hook.yml >/tmp/courier-hook.yml &&
        set -- "$$@" -c /tmp/courier-hook.yml; fi &&
        exec kratos serve "$$@" --dev --watch-courier
    environment:
      DSN: postgres://kratos@postgres:5432/kratos?sslmode=disable
      # devsms (default): sign-in codes go to the development relay below,
      # which serves the demo codes. hook: Kratos also loads
      # kratos/courier-hook.yml and hands codes to the worker's courier hook,
      # which sends them through notify (BIRGE_SMS_PROVIDER, log here) with
      # the SMS guard; read them with ./up.sh codes.
      BIRGE_KRATOS_COURIER: ${BIRGE_KRATOS_COURIER:-devsms}
    volumes:
      - ./kratos:/etc/config/kratos:ro
      - secrets:/secrets:ro
    depends_on:
      kratos-migrate: { condition: service_completed_successfully }
      keygen: { condition: service_completed_successfully }

  # Writes the development keys and the Kratos secrets once into the secrets
  # volume; later starts keep them (and the data stays readable). Keys added
  # after a volume was made (plan-link.key, analytics.key, courier-hook.secret)
  # are generated on their own. The courier hook secret is readable by Kratos'
  # user. Runs as
  # root only to hand the new volume to the image's birge user.
  keygen:
    build: { context: ../.., dockerfile: deploy/compose/Dockerfile }
    image: birge-dev:local
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        umask 077 &&
        { test -f /secrets/kek.json || birge keygen -dir /secrets; } &&
        { test -f /secrets/plan-link.key || od -An -tx1 -N32 /dev/urandom | tr -d ' \n' >/secrets/plan-link.key; } &&
        { test -f /secrets/analytics.key || od -An -tx1 -N32 /dev/urandom | tr -d ' \n' >/secrets/analytics.key; } &&
        { test -f /secrets/kratos-secret || od -An -tx1 -N32 /dev/urandom | tr -d ' \n' >/secrets/kratos-secret; } &&
        { test -f /secrets/kratos-cipher || od -An -tx1 -N16 /dev/urandom | tr -d ' \n' >/secrets/kratos-cipher; } &&
        { test -f /secrets/hydra-system || od -An -tx1 -N32 /dev/urandom | tr -d ' \n' >/secrets/hydra-system; } &&
        { test -f /secrets/hydra-introspect || od -An -tx1 -N32 /dev/urandom | tr -d ' \n' >/secrets/hydra-introspect; } &&
        { test -f /secrets/courier-hook.secret || od -An -tx1 -N32 /dev/urandom | tr -d ' \n' >/secrets/courier-hook.secret; } &&
        chown -R birge /secrets && chmod 0644 /secrets/kratos-secret /secrets/kratos-cipher /secrets/hydra-system /secrets/courier-hook.secret
    volumes:
      - secrets:/secrets

  migrate:
    image: birge-dev:local
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://birge_migrator@postgres:5432/birge?sslmode=disable
      BIRGE_APPLY_ROLES: "1"
    depends_on:
      postgres: { condition: service_healthy }
      keygen: { condition: service_completed_successfully }

  api:
    image: birge-dev:local
    command: ["api"]
    environment: *birge-env
    volumes:
      - secrets:/secrets:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
      kratos: { condition: service_started }
      nats: { condition: service_started }

  worker:
    image: birge-dev:local
    command: ["worker"]
    environment:
      <<: *birge-env
      # Internal listener of the Kratos courier hook: reached by Kratos on
      # the compose network only, never published or routed by Caddy.
      BIRGE_INTERNAL_ADDR: ":8090"
      BIRGE_COURIER_SECRET_FILE: /secrets/courier-hook.secret
    volumes:
      - secrets:/secrets:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_started }

  # Staff identity for development: Ory Hydra with the development login app
  # (cmd/birge-devlogin, no password, never deployed). The admin app signs in
  # with authorization code + PKCE; the API introspects the tokens. Hydra's
  # public port (the issuer) and the login app are on 127.0.0.1 only.
  hydra-db:
    image: postgres:18.0-alpine
    # The init script runs only on a new volume; this also covers old ones.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        { psql -h postgres -U postgres -Atc "SELECT 1 FROM pg_roles WHERE rolname = 'hydra'" | grep -q 1 ||
          psql -h postgres -U postgres -c "CREATE ROLE hydra LOGIN"; } &&
        { psql -h postgres -U postgres -Atc "SELECT 1 FROM pg_database WHERE datname = 'hydra'" | grep -q 1 ||
          psql -h postgres -U postgres -c "CREATE DATABASE hydra OWNER hydra"; }
    depends_on:
      postgres: { condition: service_healthy }

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    command: ["migrate", "sql", "up", "-e", "--yes"]
    environment:
      DSN: postgres://hydra@postgres:5432/hydra?sslmode=disable
    depends_on:
      hydra-db: { condition: service_completed_successfully }

  hydra:
    image: oryd/hydra:v26.2.0
    entrypoint: ["sh", "-c"]
    command:
      - >-
        export SECRETS_SYSTEM=$$(cat /secrets/hydra-system) &&
        exec hydra serve all --dev
    environment:
      DSN: postgres://hydra@postgres:5432/hydra?sslmode=disable
      URLS_SELF_ISSUER: http://localhost:4444/
      URLS_LOGIN: http://localhost:3000/login
      URLS_CONSENT: http://localhost:3000/consent
      SERVE_PUBLIC_CORS_ENABLED: "true"
      SERVE_PUBLIC_CORS_ALLOWED_ORIGINS: http://localhost:8082
      TTL_ACCESS_TOKEN: 1h
    volumes:
      - secrets:/secrets:ro
    ports:
      - "127.0.0.1:4444:4444"
    depends_on:
      hydra-migrate: { condition: service_completed_successfully }
      keygen: { condition: service_completed_successfully }

  # Registers the admin app (public client, PKCE) from hydra/admin-client.json
  # on every start, so edits to the file apply; it holds no secret or data.
  hydra-clients:
    image: oryd/hydra:v26.2.0
    entrypoint: ["sh", "-c"]
    command:
      - >-
        { hydra delete oauth2-client birge-admin -e http://hydra:4445 >/dev/null 2>&1 || true; } &&
        hydra import oauth2-client /etc/config/hydra/admin-client.json -e http://hydra:4445
    volumes:
      - ./hydra:/etc/config/hydra:ro
    depends_on:
      hydra: { condition: service_started }
    restart: on-failure

  devlogin:
    image: birge-dev:local
    entrypoint: ["birge-devlogin"]
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      hydra: { condition: service_started }

  # Development SMS endpoint of the Kratos courier (cmd/birge-devsms). Drops
  # every message by default (read codes with ./up.sh codes). With
  # BIRGE_DEVSMS_TELEGRAM=1 it sends the sign-in code through Telegram
  # Gateway, for testing only: the phone number leaves the jurisdiction. The
  # token is ~/.config/birge/telegram-gateway.token on the host, never in the tree.
  devsms:
    image: birge-dev:local
    entrypoint: ["birge-devsms"]
    # BIRGE_DEVSMS_TELEGRAM=1 goes in this optional host file, so the choice
    # survives tree syncs and is never committed.
    env_file:
      - path: ${HOME}/.config/birge/devsms.env
        required: false
    environment:
      BIRGE_DEVSMS_TOKEN_FILE: /run/devsms/telegram-gateway.token
      BIRGE_SMS_ALLOWED_PREFIXES: ${BIRGE_SMS_ALLOWED_PREFIXES:-+77}
      # +7 700 000 00 00..99: synthetic demo numbers whose codes the demo app
      # shows on screen (GET /demo/code). Empty turns demo codes off.
      BIRGE_DEVSMS_DEMO_PREFIX: ${BIRGE_DEVSMS_DEMO_PREFIX-+770000000}
    volumes:
      - ${HOME}/.config/birge:/run/devsms:ro

  # The exported web apps (./up.sh web builds both): the member app on
  # 127.0.0.1:8081 and the staff admin on 127.0.0.1:8082. Browsers
  # need a secure context for the sign-in proof-of-work (WebCrypto), and
  # localhost is one: from another machine use `ssh -L 8081:localhost:8081`.
  # Recreated after every export: the export replaces the directory. The
  # stack's builds live outside the tree (BIRGE_WEB_DIR, default
  # ~/.local/share/birge-web): `npm run check` rebuilds dist for localhost, and
  # tree syncs delete untracked files; either took the public site down.
  web:
    image: caddy:2.10.2-alpine
    profiles: [web]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${BIRGE_WEB_DIR:-${HOME}/.local/share/birge-web}/mobile:/srv:ro
      - ${BIRGE_WEB_DIR:-${HOME}/.local/share/birge-web}/admin:/srv-admin:ro
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  natsdata:
  secrets:
