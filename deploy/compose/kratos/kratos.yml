# Development Kratos: phone + SMS code only (ADR-0008). Reached only through
# the birge auth gateway at /auth/; the public and admin ports are not
# published. SMS go to an unreachable sink: read codes with `up.sh codes`.
version: v1.3.1
serve:
  public:
    base_url: http://localhost:8080/auth/
  admin:
    base_url: http://kratos:4434/
identity:
  default_schema_id: member
  schemas:
    - id: member
      url: file:///etc/config/kratos/identity.schema.json
selfservice:
  default_browser_return_url: http://localhost:8080/
  methods:
    password:
      enabled: false
    code:
      enabled: true
      passwordless_enabled: true
  flows:
    login:
      lifespan: 10m
    registration:
      lifespan: 10m
      after:
        code:
          hooks:
            - hook: session
courier:
  channels:
    - id: sms
      type: http
      request_config:
        url: http://sms-sink.invalid/
        method: POST
        # function(ctx) { recipient: ctx.recipient, body: ctx.body }
        body: base64://ZnVuY3Rpb24oY3R4KSB7IHJlY2lwaWVudDogY3R4LnJlY2lwaWVudCwgYm9keTogY3R4LmJvZHkgfQ==
log:
  level: info
  leak_sensitive_values: false
