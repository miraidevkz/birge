# Development Kratos: phone + SMS code only (ADR-0008). Reached only through
# the birge auth gateway at /auth/; the public and admin ports are not
# published. SMS go to the development relay (cmd/birge-devsms), which drops
# them unless Telegram delivery is enabled: read codes with `up.sh codes`.
# Production hands codes to the Birge courier hook instead: courier-hook.yml,
# loaded after this file (compose: BIRGE_KRATOS_COURIER=hook).
version: v26.2.0
serve:
  public:
    base_url: http://localhost:8080/auth/
  admin:
    base_url: http://kratos:4434/
identity:
  default_schema_id: member
  schemas:
    - id: member
      url: file:///etc/config/kratos/identity.schema.json
selfservice:
  default_browser_return_url: http://localhost:8080/
  methods:
    password:
      enabled: false
    code:
      enabled: true
      passwordless_enabled: true
  # 30 minutes (production: 10) so a tester reading codes by hand is not
  # timed out.
  flows:
    login:
      lifespan: 30m
    registration:
      lifespan: 30m
      after:
        code:
          hooks:
            - hook: session
courier:
  # SMS texts are only the code: SMS carry no content (AGENTS.md). The
  # schema requires an email template too; members have no email, so it is
  # a placeholder that is never sent.
  templates:
    registration_code:
      valid:
        email:
          body:
            plaintext: base64://QmlyZ2U=  # "Birge"
        sms:
          body:
            plaintext: base64://QmlyZ2U6IHt7IC5SZWdpc3RyYXRpb25Db2RlIH19  # "Birge: {{ .RegistrationCode }}"
    login_code:
      valid:
        email:
          body:
            plaintext: base64://QmlyZ2U=  # "Birge"
        sms:
          body:
            plaintext: base64://QmlyZ2U6IHt7IC5Mb2dpbkNvZGUgfX0=  # "Birge: {{ .LoginCode }}"
    verification_code:
      valid:
        email:
          body:
            plaintext: base64://QmlyZ2U=  # "Birge"
        sms:
          body:
            plaintext: base64://QmlyZ2U6IHt7IC5WZXJpZmljYXRpb25Db2RlIH19  # "Birge: {{ .VerificationCode }}"
  channels:
    - id: sms
      type: http
      request_config:
        url: http://devsms:4000/sms
        method: POST
        # function(ctx) { recipient: ctx.recipient, body: ctx.body }
        body: base64://ZnVuY3Rpb24oY3R4KSB7IHJlY2lwaWVudDogY3R4LnJlY2lwaWVudCwgYm9keTogY3R4LmJvZHkgfQ==
log:
  level: info
  leak_sensitive_values: false
