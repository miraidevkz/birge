# Identity of the API, worker and web pods. They never call the Kubernetes
# API, so no token is mounted and no Role is bound.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "birge.fullname" . }}
  labels:
    {{- include "birge.labels" (dict "root" $ "component" "serviceaccount") | nindent 4 }}
automountServiceAccountToken: false
