{{- $ctx := dict "root" $ "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "birge.fullname" . }}-api
  labels:
    {{- include "birge.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  # Never below the current capacity during a rollout; the migrate hook has
  # already finished when this starts.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "birge.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "birge.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ include "birge.fullname" . }}
      {{- include "birge.podSecurity" . | nindent 6 }}
      # birge stops on SIGTERM: it finishes in-flight requests first.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: {{ include "birge.image" (dict "root" $ "image" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          {{- include "birge.containerSecurity" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ include "birge.httpPort" . }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ include "birge.metricsPort" . }}
            {{- end }}
          env:
            {{- include "birge.env" $ctx | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          # 503 while PostgreSQL or NATS is unreachable: the pod leaves the
          # Service instead of failing requests.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: secrets, mountPath: /secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "birge.secretsVolume" $ctx | nindent 8 }}
        {{- include "birge.tmpVolume" . | nindent 8 }}
        {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# The API's public port, the only birge port the ingress routes.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "birge.fullname" . }}-api
  labels:
    {{- include "birge.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "birge.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.api.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "birge.fullname" . }}-api
  labels:
    {{- include "birge.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "birge.selectorLabels" $ctx | nindent 6 }}
{{- end }}
