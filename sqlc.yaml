      - db/queries/platform_outbox.sql
      - db/queries/platform_timers.sql
      - db/queries/platform_keys.sql
      - db/queries/platform_audit.sql
    gen:
      go:
        package: store
        out: internal/platform/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
