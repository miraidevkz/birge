      required: [id, roles, firstSeenAt, lastSeenAt]
      properties:
        id: {type: string, format: uuid}
        displayName: {type: string, maxLength: 80, description: From the IdP name or preferred_username claim; absent when the IdP sends neither.}
        roles: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/StaffRole'}}
        firstSeenAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
    StaffAccountList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/StaffAccount'}}
    StaffAccountCard:
      type: object
      additionalProperties: false
      required: [account, actions30d]
      properties:
        account: {$ref: '#/components/schemas/StaffAccount'}
        actions30d:
          type: array
          maxItems: 200
          description: Count per action code over the last 30 days; the entries themselves come from listAuditEntries with actorId.
          items:
            type: object
            additionalProperties: false
            required: [action, count]
            properties:
              action: {$ref: '#/components/schemas/AuditCode'}
              count: {type: integer, minimum: 0}
