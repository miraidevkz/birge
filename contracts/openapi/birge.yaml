      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SpecialistInput'}
      responses:
        '201':
          description: Pending.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Specialist'}
        default: {$ref: '#/components/responses/Problem'}
  /specialists/{specialistId}/reviews:
    parameters:
      - {name: specialistId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: putReview
      tags: [directory]
      summary: One review per member per specialist (replaces mine); goes to moderation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewInput'}
      responses:
        '200':
          description: Pending review.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Review'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/moderation/queue:
    get:
      operationId: getModerationQueue
      tags: [moderation]
      security:
        - staffOidc: []
      parameters:
        - {name: kind, in: query, required: false, schema: {$ref: '#/components/schemas/ModerationKind'}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: Oldest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModerationPage'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/moderation/items/{itemId}/decision:
    parameters:
      - {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: decideModerationItem
      tags: [moderation]
      summary: Approve or reject (reason code goes to the author). Audited.
      security:
        - staffOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModerationDecision'}
      responses:
        '204': {description: Decided.}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/members:
    get:
      operationId: staffListMembers
      tags: [membership]
      summary: Verified or suspended members, for mentor assignment and suspension review. Staff moderator or admin, MFA. Audited.
      description: |
        Moderation items carry no member IDs by design, so this is how staff find a member to
        make a mentor or to review a suspension. First name and district only: never the
        phone, children, needs or check-ins. Each read is written to the audit log.
      security:
        - staffOidc: []
      parameters:
        - {name: status, in: query, required: true, schema: {type: string, enum: [verified, suspended], x-enum-varnames: [StaffMembersVerified, StaffMembersSuspended]}}
        - {name: districtId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: Members, most recently verified or suspended first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffMemberPage'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/members/{memberId}/roles/mentor:
    parameters:
      - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: grantMentorRole
      tags: [membership]
      summary: Give a verified member the mentor role, so she can be assigned to a room (409 when she is not verified or is suspended). Staff moderator or admin, MFA. Audited.
      security:
        - staffOidc: []
      responses:
        '204': {description: Granted (idempotent).}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: revokeMentorRole
      tags: [membership]
      summary: Take the mentor role away; chat removes her from every room she mentors. Staff moderator or admin, MFA. Audited.
      security:
        - staffOidc: []
      responses:
        '204': {description: Revoked (idempotent).}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/members/{memberId}/suspension:
    parameters:
      - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getMemberSuspension
      tags: [membership]
      summary: Suspension status of a member. Staff moderator or admin, MFA.
      security:
        - staffOidc: []
      responses:
        '200':
          description: Current suspension state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberSuspension'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: liftMemberSuspension
      tags: [membership]
      summary: Lift a member suspension. Staff admin, MFA. Audited.
      security:
        - staffOidc: []
      responses:
        '204': {description: Lifted (idempotent when not suspended).}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/audit:
    get:
      operationId: listAuditEntries
      tags: [staff]
      summary: Audit log of staff actions, newest first. Staff admin, MFA. Reading it is audited too.
      description: |
        Only entries whose actor is staff (psychologist, moderator, lawyer, admin). Entries by
        members (for example a trusted contact viewing a shared plan) are not listed here.
        Entries carry codes and IDs only, never content (package platform/audit).
      security:
        - staffOidc: []
      parameters:
        - {name: actorId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: objectType, in: query, required: false, schema: {$ref: '#/components/schemas/AuditCode'}}
        - {name: objectId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: action, in: query, required: false, schema: {$ref: '#/components/schemas/AuditCode'}}
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: One page, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/accounts:
    get:
      operationId: listStaffAccounts
      tags: [staff]
      summary: Staff who have signed in to this deployment, most recently active first. Staff admin, MFA.
      description: |
        A staff account is recorded the first time a valid staff token reaches the API and
        refreshed at most once an hour (name and roles as the IdP last sent them). The IdP
        stays the authority on who is staff; this list is for reading the audit log.
      security:
        - staffOidc: []
      responses:
        '200':
          description: All staff accounts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffAccountList'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/accounts/{staffId}:
    parameters:
      - {name: staffId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getStaffAccount
      tags: [staff]
      summary: One staff member's card with action counts for the last 30 days. Staff admin, MFA.
      security:
        - staffOidc: []
      responses:
        '200':
          description: Staff card.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffAccountCard'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/metrics:
    get:
      operationId: getMetrics
      tags: [analytics]
      summary: Pilot metrics of requirements section 9 for a period. Staff admin, MFA. Audited.
      security:
        - staffOidc: []
      parameters:
        - $ref: '#/components/parameters/MetricsFrom'
        - $ref: '#/components/parameters/MetricsTo'
      responses:
        '200':
          description: Aggregates; every cell from fewer than k members is suppressed.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metrics'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/metrics.csv:
    get:
      operationId: getMetricsCsv
      tags: [analytics]
      summary: The same metrics as CSV (one row per metric and period bucket). Staff admin, MFA. Audited.
      description: |
        Columns: metric, bucket, members, value, suppressed. A suppressed row has empty
        members and value and suppressed=true. UTF-8 with a header row.
      security:
        - staffOidc: []
      parameters:
        - $ref: '#/components/parameters/MetricsFrom'
        - $ref: '#/components/parameters/MetricsTo'
      responses:
        '200':
          description: CSV export.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Content-Disposition:
              schema: {type: string, maxLength: 120}
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    memberSession:
      type: http
      scheme: bearer
      description: Session token issued after member sign-in (ADR-0008).
    staffOidc:
      type: openIdConnect
      openIdConnectUrl: /.well-known/openid-configuration
      description: Staff sign-in through any OIDC provider (ADR-0008).
  parameters:
    MatchId: {name: matchId, in: path, required: true, schema: {type: string, format: uuid}}
    RoomId: {name: roomId, in: path, required: true, schema: {type: string, format: uuid}}
    ListingId: {name: listingId, in: path, required: true, schema: {type: string, format: uuid}}
    LangQuery:
      name: lang
      in: query
      required: true
      schema: {$ref: '#/components/schemas/Lang'}
    TopicId:
      name: topicId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ArticleId:
      name: articleId
      in: path
      required: true
      schema: {type: string, format: uuid}
    VersionId:
      name: versionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SosId:
      name: sosId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EscalationId:
      name: escalationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      schema:
        type: string
        pattern: '^\d+\.\d+\.\d+$'
        maxLength: 32
    AppPlatform:
      name: X-App-Platform
      in: header
      required: true
      schema:
        type: string
        enum: [ios, android, web]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUIDv7; repeated requests with the same key have one effect.
      schema:
        type: string
        format: uuid
    MetricsFrom:
      name: from
      in: query
      required: true
      description: First day of the period (inclusive, deployment time zone).
      schema: {type: string, format: date}
    MetricsTo:
      name: to
      in: query
      required: true
      description: Last day of the period (inclusive); at most 12 months after from.
      schema: {type: string, format: date}
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          maxLength: 256
        title:
          type: string
          maxLength: 256
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 1024
        code:
          type: string
          description: Stable machine-readable error code.
          maxLength: 64
    ClientConfig:
      type: object
      additionalProperties: false
      required: [minSupportedVersion, latestVersion, updateRequired, crisisPhones, features]
      properties:
        minSupportedVersion:
          type: string
          maxLength: 32
        latestVersion:
          type: string
          maxLength: 32
        updateRequired:
          type: boolean
          description: True when this app version is blocked (security issue or outside the support window).
        crisisPhones:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/CrisisPhone'
        features:
          type: object
          description: Remote feature flags (ADR-0018).
          maxProperties: 100
          additionalProperties:
            type: boolean
    CrisisPhone:
      type: object
      additionalProperties: false
      required: [number, label]
      properties:
        number:
          type: string
          pattern: '^[0-9+]{2,16}$'
        label:
          type: string
          description: Localized label, e.g. "Emergency services".
          maxLength: 120

    Member:
      type: object
      additionalProperties: false
      required: [id, lang, verification, roles, children]
      properties:
        id: {type: string, format: uuid}
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: Absent until the member sets it during onboarding.
        lang: {$ref: '#/components/schemas/Lang'}
        cityId: {type: string, format: uuid}
        districtId: {type: string, format: uuid}
        verification:
          type: string
          enum: [new, pending, verified]
        roles:
          type: array
          maxItems: 6
          items:
            type: string
            enum: [mom, mentor, psychologist, lawyer, moderator, admin]
        children:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/Child'}
    MemberUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: {type: string, minLength: 1, maxLength: 40}
        lang: {$ref: '#/components/schemas/Lang'}
        districtId:
          type: string
          format: uuid
          description: The city is derived from the district.
    Lang:
      type: string
      description: Interface languages at launch. New languages are added by configuration and locale files (ADR-0014).
      enum: [kk, ru, en]
    Child:
      type: object
      additionalProperties: false
      required: [id, birthYear, needs]
      properties:
        id: {type: string, format: uuid}
        birthYear: {type: integer, minimum: 1990, maximum: 2100}
        needs:
          type: array
          maxItems: 10
          items: {type: string, pattern: '^[a-z_]{2,40}$'}
          description: Codes from /reference/needs; empty means "prefer not to say".
    ChildInput:
      type: object
      additionalProperties: false
      required: [birthYear, needs]
      properties:
        birthYear: {type: integer, minimum: 1990, maximum: 2100}
        needs:
          type: array
          maxItems: 10
          items: {type: string, pattern: '^[a-z_]{2,40}$'}
    BlockedMember:
      type: object
      additionalProperties: false
      required: [memberId, displayName, since]
      properties:
        memberId: {type: string, format: uuid}
        displayName: {type: string, maxLength: 40}
        since: {type: string, format: date-time}
    City:
      type: object
      additionalProperties: false
      required: [id, code, districts]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[a-z_]{2,40}$', description: Locale key for the name.}
        districts:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, code]
            properties:
              id: {type: string, format: uuid}
              code: {type: string, pattern: '^[a-z_]{2,40}$'}
    ConsentType:
      type: string
      enum: [data_processing, ai_crossborder, research]
    Consent:
      type: object
      additionalProperties: false
      required: [type, granted, currentVersion]
      properties:
        type: {$ref: '#/components/schemas/ConsentType'}
        granted: {type: boolean, description: True only when granted for the current text version.}
        grantedVersion: {type: string, maxLength: 32}
        currentVersion: {type: string, maxLength: 32}
        changedAt: {type: string, format: date-time}
    ConsentChange:
      type: object
      additionalProperties: false
      required: [type, version, granted]
      properties:
        type: {$ref: '#/components/schemas/ConsentType'}
        version: {type: string, maxLength: 32, description: Version of the text the member saw.}
        granted: {type: boolean}
    DeletionRequest:
      type: object
      additionalProperties: false
      required: [requestedAt, dueAt]
      properties:
        requestedAt: {type: string, format: date-time}
        dueAt: {type: string, format: date-time}
    InboxPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/Notification'}
        nextCursor: {type: string, maxLength: 128}
    Notification:
      type: object
      additionalProperties: false
      required: [id, template, params, class, createdAt]
      properties:
        id: {type: string, format: uuid}
        template:
          type: string
          pattern: '^[a-z]+\.[a-z_]+$'
          description: Locale key, e.g. emergency.sos_response. Text is rendered by the client.
        params:
          type: object
          maxProperties: 10
          additionalProperties: {type: string, maxLength: 120}
          description: IDs and short non-sensitive values only.
        class:
          type: string
          enum: [critical, normal, reminder]
        createdAt: {type: string, format: date-time}
        readAt: {type: string, format: date-time}
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [platform, pushToken]
      properties:
        platform:
          type: string
          enum: [ios, android]
        pushToken: {type: string, minLength: 8, maxLength: 4096}

    HelpRequestAccepted:
      type: object
      additionalProperties: false
      required: [escalationId, crisisPhones]
      properties:
        escalationId: {type: string, format: uuid}
        crisisPhones:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/CrisisPhone'}
    EscalationSource:
      type: string
      enum: [assistant, checkin, sos, menu, chat]
    Escalation:
      type: object
      additionalProperties: false
      required: [id, source, status, openedAt]
      properties:
        id: {type: string, format: uuid}
        source: {$ref: '#/components/schemas/EscalationSource'}
        status:
          type: string
          enum: [open, taken, closed]
        openedAt: {type: string, format: date-time}
        districtId: {type: string, format: uuid, description: "For routing; no name or contact. Absent when unknown."}
        takenAt: {type: string, format: date-time}
        takenByMe: {type: boolean}
        outcome:
          type: string
          enum: [contacted, referred, emergency_services, no_answer, not_a_crisis]
        closedAt: {type: string, format: date-time}
    EscalationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Escalation'}
        nextCursor: {type: string, maxLength: 128}
    EscalationContact:
      type: object
      additionalProperties: false
      required: [displayName, phone, lang]
      properties:
        displayName: {type: string, maxLength: 40}
        phone: {type: string, pattern: '^\+[1-9][0-9]{7,14}$'}
        lang: {$ref: '#/components/schemas/Lang'}
    DutyShift:
      type: object
      additionalProperties: false
      required: [id, staffId, role, startsAt, endsAt, backup]
      properties:
        id: {type: string, format: uuid}
        staffId: {type: string, format: uuid}
        role:
          type: string
          enum: [psychologist, moderator]
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        backup: {type: boolean, description: Backup shifts are notified when the primary does not take an escalation in time.}
    DutyShiftInput:
      type: object
      additionalProperties: false
      required: [staffId, role, startsAt, endsAt, backup, phone]
      properties:
        staffId: {type: string, format: uuid}
        role:
          type: string
          enum: [psychologist, moderator]
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        backup: {type: boolean}
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: On-duty phone for SMS alerts; stored encrypted, never returned.
    CheckinSchedule:
      type: object
      additionalProperties: false
      properties:
        weekday: {type: integer, minimum: 1, maximum: 7, description: "ISO weekday: 1 is Monday."}
        hour: {type: integer, minimum: 0, maximum: 23, description: Local hour in the deployment time zone.}
        enabled: {type: boolean}
    Questionnaire:
      type: object
      additionalProperties: false
      required: [version, questions]
      properties:
        version: {type: string, maxLength: 32}
        questions:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, instrument, textKey, options]
            properties:
              id: {type: string, pattern: '^[a-z0-9_]{1,40}$'}
              instrument:
                type: string
                enum: [phq4, pss4]
              textKey: {type: string, maxLength: 80}
              options:
                type: array
                maxItems: 6
                items:
                  type: object
                  additionalProperties: false
                  required: [value, textKey]
                  properties:
                    value: {type: integer, minimum: 0, maximum: 5}
                    textKey: {type: string, maxLength: 80}
    CheckinSubmission:
      type: object
      additionalProperties: false
      required: [questionnaireVersion, answers]
      properties:
        questionnaireVersion: {type: string, maxLength: 32}
        answers:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [questionId, value]
            properties:
              questionId: {type: string, pattern: '^[a-z0-9_]{1,40}$'}
              value: {type: integer, minimum: 0, maximum: 5}
    CheckinFlag:
      type: string
      enum: [none, elevated, crisis]
    CheckinResult:
      type: object
      additionalProperties: false
      required: [id, flag, feedbackKey, suggestion]
      properties:
        id: {type: string, format: uuid}
        flag: {$ref: '#/components/schemas/CheckinFlag'}
        feedbackKey: {type: string, maxLength: 80, description: Locale key of the short feedback; never a diagnosis.}
        suggestion:
          type: string
          enum: [practice, tea, talk, psychologist, none]
        escalationId: {type: string, format: uuid, description: Present when flag is crisis.}
        crisisPhones:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/CrisisPhone'}
    CheckinPoint:
      type: object
      additionalProperties: false
      required: [completedAt, phq4, pss4]
      properties:
        completedAt: {type: string, format: date-time}
        phq4: {type: integer, minimum: 0, maximum: 12}
        pss4: {type: integer, minimum: 0, maximum: 16}
    Practice:
      type: object
      additionalProperties: false
      required: [id, titleKey, durationSeconds, url]
      properties:
        id: {type: string, format: uuid}
        titleKey: {type: string, maxLength: 80}
        durationSeconds: {type: integer, minimum: 1, maximum: 3600}
        url: {type: string, format: uri, maxLength: 2048, description: In-jurisdiction object storage.}

    SosType:
      type: string
      enum: [childcare, item_or_medicine, other]
    SosInput:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: {$ref: '#/components/schemas/SosType'}
        text: {type: string, minLength: 1, maxLength: 300}
    SosRequest:
      type: object
      additionalProperties: false
      required: [id, type, text, status, sharedToDistrict, createdAt, responseCount]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/SosType'}
        text: {type: string, maxLength: 300}
        status:
          type: string
          enum: [open, closed]
        sharedToDistrict: {type: boolean}
        createdAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time, description: Automatic closing time.}
