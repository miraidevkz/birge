openapi: 3.1.0
info:
  title: Birge API
  version: 0.1.0
  description: |
    HTTP API for the Birge mobile app and staff admin.
    Changes within /v1 are additive only (ADR-0018). Contracts change before code (ADR-0005).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /v1
tags:
  - name: meta
    description: Client configuration and compatibility.
  - name: membership
    description: The member's profile, children, verification, blocks and reference data.
  - name: privacy
    description: Consents and account deletion.
  - name: notify
    description: In-app inbox and push devices.
  - name: safety
    description: Crisis help requests (members) and the escalation queue and duty roster (staff).
  - name: wellbeing
    description: Weekly check-ins, history and audio practices.
security:
  - memberSession: []
paths:
  /meta/client-config:
    get:
      operationId: getClientConfig
      tags: [meta]
      summary: Configuration the client needs before sign-in.
      description: |
        Returns the minimum supported app version, feature flags and crisis phone numbers.
        Reachable without a session and by blocked app versions, so the update screen can
        always show crisis numbers (ADR-0018).
      security: []
      parameters:
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppPlatform'
      responses:
        '200':
          description: Client configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
        default:
          $ref: '#/components/responses/Problem'

  /me:
    get:
      operationId: getMe
      tags: [membership]
      summary: The signed-in member. Created on first call after sign-up.
      responses:
        '200':
          description: Member profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateMe
      tags: [membership]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemberUpdate'}
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        default: {$ref: '#/components/responses/Problem'}
  /me/children:
    post:
      operationId: addChild
      tags: [membership]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChildInput'}
      responses:
        '201':
          description: Child added.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Child'}
        default: {$ref: '#/components/responses/Problem'}
  /me/children/{childId}:
    parameters:
      - name: childId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: updateChild
      tags: [membership]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChildInput'}
      responses:
        '200':
          description: Child updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Child'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteChild
      tags: [membership]
      responses:
        '204': {description: Child removed.}
        default: {$ref: '#/components/responses/Problem'}
  /me/verification-requests:
    post:
      operationId: requestVerification
      tags: [membership]
      summary: Ask a moderator for a verification call.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Request queued (or already pending).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        default: {$ref: '#/components/responses/Problem'}
  /me/blocks:
    get:
      operationId: listBlocks
      tags: [membership]
      responses:
        '200':
          description: Members blocked by me (ADR-0019).
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items: {$ref: '#/components/schemas/BlockedMember'}
        default: {$ref: '#/components/responses/Problem'}
  /me/blocks/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: blockMember
      tags: [membership]
      summary: Block a member (mutual invisibility; the other member is not told).
      responses:
        '204': {description: Blocked (idempotent).}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: unblockMember
      tags: [membership]
      responses:
        '204': {description: Unblocked (idempotent).}
        default: {$ref: '#/components/responses/Problem'}
  /reference/districts:
    get:
      operationId: listDistricts
      tags: [membership]
      summary: Cities and districts of this deployment.
      security: []
      responses:
        '200':
          description: Cities with their districts.
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: {$ref: '#/components/schemas/City'}
        default: {$ref: '#/components/responses/Problem'}
  /reference/needs:
    get:
      operationId: listNeeds
      tags: [membership]
      summary: Special-needs categories (localized labels come from locale files by code).
      security: []
      responses:
        '200':
          description: Needs codes.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: {type: string, pattern: '^[a-z_]{2,40}$'}
        default: {$ref: '#/components/responses/Problem'}
  /me/consents:
    get:
      operationId: listConsents
      tags: [privacy]
      responses:
        '200':
          description: Current state of every consent type.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items: {$ref: '#/components/schemas/Consent'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: setConsent
      tags: [privacy]
      summary: Grant or revoke a consent for a specific text version.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentChange'}
      responses:
        '200':
          description: New state of that consent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Consent'}
        default: {$ref: '#/components/responses/Problem'}
  /me/deletion-request:
    post:
      operationId: requestDeletion
      tags: [privacy]
      summary: Delete all my data within 24 hours.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm:
                  type: string
                  enum: [DELETE]
                  description: Explicit confirmation typed or tapped by the member.
      responses:
        '202':
          description: Deletion scheduled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeletionRequest'}
        default: {$ref: '#/components/responses/Problem'}
  /me/inbox:
    get:
      operationId: listInbox
      tags: [notify]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: {type: string, maxLength: 128}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxPage'}
        default: {$ref: '#/components/responses/Problem'}
  /me/inbox/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: markRead
      tags: [notify]
      summary: Mark as read; for critical notifications this also acknowledges delivery and stops the SMS fallback.
      responses:
        '204': {description: Marked (idempotent).}
        default: {$ref: '#/components/responses/Problem'}
  /me/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: registerDevice
      tags: [notify]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceRegistration'}
      responses:
        '204': {description: Registered or updated.}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: unregisterDevice
      tags: [notify]
      responses:
        '204': {description: Removed (idempotent).}
        default: {$ref: '#/components/responses/Problem'}

  /me/help-requests:
    post:
      operationId: requestHumanHelp
      tags: [safety]
      summary: "\"Contact a person now\": opens an escalation to the on-duty staff."
      description: |
        Works for every member, verified or not, and does not depend on the AI assistant.
        The client shows the fixed crisis screen from its locale files together with the
        returned crisis phones; it never waits for this call to show them.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source]
              properties:
                source:
                  type: string
                  enum: [assistant, checkin, sos, menu]
                  description: Where the member pressed the button.
      responses:
        '202':
          description: Escalation opened (or the already open one for this member).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HelpRequestAccepted'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/escalations:
    get:
      operationId: listEscalations
      tags: [safety]
      security:
        - staffOidc: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, taken, closed]
            default: open
        - name: cursor
          in: query
          required: false
          schema: {type: string, maxLength: 128}
      responses:
        '200':
          description: Oldest open first; no personal data until taken.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EscalationPage'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/escalations/{escalationId}/take:
    parameters:
      - $ref: '#/components/parameters/EscalationId'
    post:
      operationId: takeEscalation
      tags: [safety]
      summary: The caller becomes responsible; cancels the backup timer. Audited.
      security:
        - staffOidc: []
      responses:
        '200':
          description: Taken by the caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Escalation'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/escalations/{escalationId}/contact:
    parameters:
      - $ref: '#/components/parameters/EscalationId'
    post:
      operationId: revealEscalationContact
      tags: [safety]
      summary: Reveal the member's name and phone to the staff member who took the escalation. Audited.
      security:
        - staffOidc: []
      responses:
        '200':
          description: Contact details.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EscalationContact'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/escalations/{escalationId}/close:
    parameters:
      - $ref: '#/components/parameters/EscalationId'
    post:
      operationId: closeEscalation
      tags: [safety]
      security:
        - staffOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [contacted, referred, emergency_services, no_answer, not_a_crisis]
                note:
                  type: string
                  maxLength: 2000
                  description: Stored encrypted; visible only to staff with access to this escalation.
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Escalation'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/duty-roster:
    get:
      operationId: getDutyRoster
      tags: [safety]
      security:
        - staffOidc: []
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Shifts overlapping the period.
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: {$ref: '#/components/schemas/DutyShift'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: addDutyShift
      tags: [safety]
      summary: Admin only.
      security:
        - staffOidc: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DutyShiftInput'}
      responses:
        '201':
          description: Shift added.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DutyShift'}
        default: {$ref: '#/components/responses/Problem'}
  /staff/duty-roster/{shiftId}:
    parameters:
      - name: shiftId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: deleteDutyShift
      tags: [safety]
      summary: Admin only; a shift that has started cannot be deleted.
      security:
        - staffOidc: []
      responses:
        '204': {description: Removed.}
        default: {$ref: '#/components/responses/Problem'}
  /me/checkins/schedule:
    get:
      operationId: getCheckinSchedule
      tags: [wellbeing]
      responses:
        '200':
          description: Reminder schedule (absent fields = no reminder yet).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckinSchedule'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: setCheckinSchedule
      tags: [wellbeing]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckinSchedule'}
      responses:
        '200':
          description: Saved; the next reminder is scheduled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckinSchedule'}
        default: {$ref: '#/components/responses/Problem'}
  /me/checkins/questionnaire:
    get:
      operationId: getQuestionnaire
      tags: [wellbeing]
      summary: Questions and answer options as locale keys (texts and thresholds are configuration).
      responses:
        '200':
          description: Current questionnaire.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Questionnaire'}
        default: {$ref: '#/components/responses/Problem'}
  /me/checkins:
    post:
      operationId: submitCheckin
      tags: [wellbeing]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckinSubmission'}
      responses:
        '201':
          description: |
            Scored. When flag is crisis the client shows the fixed crisis screen and an
            escalation has already been opened (source checkin); when elevated the client
            offers to contact a psychologist (requestHumanHelp with source checkin).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckinResult'}
        default: {$ref: '#/components/responses/Problem'}
  /me/checkins/history:
    get:
      operationId: getCheckinHistory
      tags: [wellbeing]
      parameters:
        - name: weeks
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 52, default: 8}
      responses:
        '200':
          description: One point per completed check-in, oldest first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 60
                items: {$ref: '#/components/schemas/CheckinPoint'}
        default: {$ref: '#/components/responses/Problem'}
  /practices:
    get:
      operationId: listPractices
      tags: [wellbeing]
      parameters:
        - name: lang
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Lang'}
      responses:
        '200':
          description: Audio practices in the given language.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: {$ref: '#/components/schemas/Practice'}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    memberSession:
      type: http
      scheme: bearer
      description: Session token issued after member sign-in (ADR-0008).
    staffOidc:
      type: openIdConnect
      openIdConnectUrl: /.well-known/openid-configuration
      description: Staff sign-in through any OIDC provider (ADR-0008).
  parameters:
    EscalationId:
      name: escalationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      schema:
        type: string
        pattern: '^\d+\.\d+\.\d+$'
        maxLength: 32
    AppPlatform:
      name: X-App-Platform
      in: header
      required: true
      schema:
        type: string
        enum: [ios, android, web]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUIDv7; repeated requests with the same key have one effect.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          maxLength: 256
        title:
          type: string
          maxLength: 256
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 1024
        code:
          type: string
          description: Stable machine-readable error code.
          maxLength: 64
    ClientConfig:
      type: object
      additionalProperties: false
      required: [minSupportedVersion, latestVersion, updateRequired, crisisPhones, features]
      properties:
        minSupportedVersion:
          type: string
          maxLength: 32
        latestVersion:
          type: string
          maxLength: 32
        updateRequired:
          type: boolean
          description: True when this app version is blocked (security issue or outside the support window).
        crisisPhones:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/CrisisPhone'
        features:
          type: object
          description: Remote feature flags (ADR-0018).
          maxProperties: 100
          additionalProperties:
            type: boolean
    CrisisPhone:
      type: object
      additionalProperties: false
      required: [number, label]
      properties:
        number:
          type: string
          pattern: '^[0-9+]{2,16}$'
        label:
          type: string
          description: Localized label, e.g. "Emergency services".
          maxLength: 120

    Member:
      type: object
      additionalProperties: false
      required: [id, lang, verification, roles, children]
      properties:
        id: {type: string, format: uuid}
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: Absent until the member sets it during onboarding.
        lang: {$ref: '#/components/schemas/Lang'}
        cityId: {type: string, format: uuid}
        districtId: {type: string, format: uuid}
        verification:
          type: string
          enum: [new, pending, verified]
        roles:
          type: array
          maxItems: 6
          items:
            type: string
            enum: [mom, mentor, psychologist, lawyer, moderator, admin]
        children:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/Child'}
    MemberUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: {type: string, minLength: 1, maxLength: 40}
        lang: {$ref: '#/components/schemas/Lang'}
        districtId:
          type: string
          format: uuid
          description: The city is derived from the district.
    Lang:
      type: string
      enum: [kk, ru]
    Child:
      type: object
      additionalProperties: false
      required: [id, birthYear, needs]
      properties:
        id: {type: string, format: uuid}
        birthYear: {type: integer, minimum: 1990, maximum: 2100}
        needs:
          type: array
          maxItems: 10
          items: {type: string, pattern: '^[a-z_]{2,40}$'}
          description: Codes from /reference/needs; empty means "prefer not to say".
    ChildInput:
      type: object
      additionalProperties: false
      required: [birthYear, needs]
      properties:
        birthYear: {type: integer, minimum: 1990, maximum: 2100}
        needs:
          type: array
          maxItems: 10
          items: {type: string, pattern: '^[a-z_]{2,40}$'}
    BlockedMember:
      type: object
      additionalProperties: false
      required: [memberId, displayName, since]
      properties:
        memberId: {type: string, format: uuid}
        displayName: {type: string, maxLength: 40}
        since: {type: string, format: date-time}
    City:
      type: object
      additionalProperties: false
      required: [id, code, districts]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[a-z_]{2,40}$', description: Locale key for the name.}
        districts:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, code]
            properties:
              id: {type: string, format: uuid}
              code: {type: string, pattern: '^[a-z_]{2,40}$'}
    ConsentType:
      type: string
      enum: [data_processing, ai_crossborder, research]
    Consent:
      type: object
      additionalProperties: false
      required: [type, granted, currentVersion]
      properties:
        type: {$ref: '#/components/schemas/ConsentType'}
        granted: {type: boolean, description: True only when granted for the current text version.}
        grantedVersion: {type: string, maxLength: 32}
        currentVersion: {type: string, maxLength: 32}
        changedAt: {type: string, format: date-time}
    ConsentChange:
      type: object
      additionalProperties: false
      required: [type, version, granted]
      properties:
        type: {$ref: '#/components/schemas/ConsentType'}
        version: {type: string, maxLength: 32, description: Version of the text the member saw.}
        granted: {type: boolean}
    DeletionRequest:
      type: object
      additionalProperties: false
      required: [requestedAt, dueAt]
      properties:
        requestedAt: {type: string, format: date-time}
        dueAt: {type: string, format: date-time}
    InboxPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/Notification'}
        nextCursor: {type: string, maxLength: 128}
    Notification:
      type: object
      additionalProperties: false
      required: [id, template, params, class, createdAt]
      properties:
        id: {type: string, format: uuid}
        template:
          type: string
          pattern: '^[a-z]+\.[a-z_]+$'
          description: Locale key, e.g. emergency.sos_response. Text is rendered by the client.
        params:
          type: object
          maxProperties: 10
          additionalProperties: {type: string, maxLength: 120}
          description: IDs and short non-sensitive values only.
        class:
          type: string
          enum: [critical, normal, reminder]
        createdAt: {type: string, format: date-time}
        readAt: {type: string, format: date-time}
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [platform, pushToken]
      properties:
        platform:
          type: string
          enum: [ios, android]
        pushToken: {type: string, minLength: 8, maxLength: 4096}

    HelpRequestAccepted:
      type: object
      additionalProperties: false
      required: [escalationId, crisisPhones]
      properties:
        escalationId: {type: string, format: uuid}
        crisisPhones:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/CrisisPhone'}
    EscalationSource:
      type: string
      enum: [assistant, checkin, sos, menu]
    Escalation:
      type: object
      additionalProperties: false
      required: [id, source, status, openedAt, districtId]
      properties:
        id: {type: string, format: uuid}
        source: {$ref: '#/components/schemas/EscalationSource'}
        status:
          type: string
          enum: [open, taken, closed]
        openedAt: {type: string, format: date-time}
        districtId: {type: string, format: uuid, description: For routing; no name or contact.}
        takenAt: {type: string, format: date-time}
        takenByMe: {type: boolean}
        outcome:
          type: string
          enum: [contacted, referred, emergency_services, no_answer, not_a_crisis]
        closedAt: {type: string, format: date-time}
    EscalationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Escalation'}
        nextCursor: {type: string, maxLength: 128}
    EscalationContact:
      type: object
      additionalProperties: false
      required: [displayName, phone, lang]
      properties:
        displayName: {type: string, maxLength: 40}
        phone: {type: string, pattern: '^\+[1-9][0-9]{7,14}$'}
        lang: {$ref: '#/components/schemas/Lang'}
    DutyShift:
      type: object
      additionalProperties: false
      required: [id, staffId, role, startsAt, endsAt, backup]
      properties:
        id: {type: string, format: uuid}
        staffId: {type: string, format: uuid}
        role:
          type: string
          enum: [psychologist, moderator]
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        backup: {type: boolean, description: Backup shifts are notified when the primary does not take an escalation in time.}
    DutyShiftInput:
      type: object
      additionalProperties: false
      required: [staffId, role, startsAt, endsAt, backup, phone]
      properties:
        staffId: {type: string, format: uuid}
        role:
          type: string
          enum: [psychologist, moderator]
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        backup: {type: boolean}
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: On-duty phone for SMS alerts; stored encrypted, never returned.
    CheckinSchedule:
      type: object
      additionalProperties: false
      properties:
        weekday: {type: integer, minimum: 1, maximum: 7, description: "ISO weekday: 1 is Monday."}
        hour: {type: integer, minimum: 0, maximum: 23, description: Local hour in the deployment time zone.}
        enabled: {type: boolean}
    Questionnaire:
      type: object
      additionalProperties: false
      required: [version, questions]
      properties:
        version: {type: string, maxLength: 32}
        questions:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, instrument, textKey, options]
            properties:
              id: {type: string, pattern: '^[a-z0-9_]{1,40}$'}
              instrument:
                type: string
                enum: [phq4, pss4]
              textKey: {type: string, maxLength: 80}
              options:
                type: array
                maxItems: 6
                items:
                  type: object
                  additionalProperties: false
                  required: [value, textKey]
                  properties:
                    value: {type: integer, minimum: 0, maximum: 5}
                    textKey: {type: string, maxLength: 80}
    CheckinSubmission:
      type: object
      additionalProperties: false
      required: [questionnaireVersion, answers]
      properties:
        questionnaireVersion: {type: string, maxLength: 32}
        answers:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [questionId, value]
            properties:
              questionId: {type: string, pattern: '^[a-z0-9_]{1,40}$'}
              value: {type: integer, minimum: 0, maximum: 5}
    CheckinFlag:
      type: string
      enum: [none, elevated, crisis]
    CheckinResult:
      type: object
      additionalProperties: false
      required: [id, flag, feedbackKey, suggestion]
      properties:
        id: {type: string, format: uuid}
        flag: {$ref: '#/components/schemas/CheckinFlag'}
        feedbackKey: {type: string, maxLength: 80, description: Locale key of the short feedback; never a diagnosis.}
        suggestion:
          type: string
          enum: [practice, tea, talk, psychologist, none]
        escalationId: {type: string, format: uuid, description: Present when flag is crisis.}
        crisisPhones:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/CrisisPhone'}
    CheckinPoint:
      type: object
      additionalProperties: false
      required: [completedAt, phq4, pss4]
      properties:
        completedAt: {type: string, format: date-time}
        phq4: {type: integer, minimum: 0, maximum: 12}
        pss4: {type: integer, minimum: 0, maximum: 16}
    Practice:
      type: object
      additionalProperties: false
      required: [id, titleKey, durationSeconds, url]
      properties:
        id: {type: string, format: uuid}
        titleKey: {type: string, maxLength: 80}
        durationSeconds: {type: integer, minimum: 1, maximum: 3600}
        url: {type: string, format: uri, maxLength: 2048, description: In-jurisdiction object storage.}
