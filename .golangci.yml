version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
    - wrapcheck
  settings:
    depguard:
      rules:
        banned:
          files: ["$all"]
          deny:
            - pkg: log$
              desc: use log/slog
            - pkg: math/rand$
              desc: use math/rand/v2, or crypto/rand for anything security-related
            - pkg: github.com/pkg/errors
              desc: use the standard errors package
            - pkg: github.com/stretchr/testify
              desc: use the standard testing package (AGENTS.md)
    wrapcheck:
      ignore-package-globs:
        - birge/*
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, wrapcheck, noctx]
      - path: internal/platform/testinfra/
        linters: [gosec, noctx]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [birge]
